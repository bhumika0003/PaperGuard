
name: Deploy PaperGuard

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: paperguard-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -eu

          REPO=/home/ubuntu/paperguard-deploy
          ENV_FILE=/home/ubuntu/devops_vap/.env
          COMPOSE_FILE=/home/ubuntu/paperguard-deploy/docker-compose.prod.yml

          cd "$REPO"
          test -f "$ENV_FILE"
          test -f "$COMPOSE_FILE"

          git fetch origin main
          git checkout -B main origin/main

          sudo docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" config --quiet

          OLD_IMAGE=$(sudo docker inspect -f '{{.Image}}' securestack-app)
          BACKUP_TAG="paperguard-deploy-app:rollback-$(date +%Y%m%d%H%M%S)"
          sudo docker image tag "$OLD_IMAGE" "$BACKUP_TAG"
          echo "Previous image backed up."

          sudo docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" build app

          if ! sudo docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --no-build app; then
            echo "Container start failed; attempting rollback."
            sudo docker image tag "$BACKUP_TAG" paperguard-deploy-app:latest
            sudo docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --no-build --force-recreate app
            exit 1
          fi

          healthy=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent http://127.0.0.1:8001/api/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Health checks failed; attempting rollback."
            sudo docker image tag "$BACKUP_TAG" paperguard-deploy-app:latest
            sudo docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --no-build --force-recreate app

            if curl --fail --silent http://127.0.0.1:8001/api/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              echo "Rollback completed; previous version is responding."
            else
              echo "Rollback health checks also failed. Manual investigation is required."
            fi
            exit 1
          fi

          echo "Deployment successful; frontend and API checks passed."
          REMOTE
          )

          PARAMETERS=$(jq -n --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-069cc54805a1c1d89 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment command submitted."

          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-069cc54805a1c1d89 \
              --query Status --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-069cc54805a1c1d89 \
                  --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-069cc54805a1c1d89 \
                  --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for the deployment command."
          exit 1
