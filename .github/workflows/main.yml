
name: Deploy PaperGuard

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    name: Verify EC2 through AWS Systems Manager
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Check EC2 deployment configuration
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-069cc54805a1c1d89 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["cd /home/ubuntu/devops_vap && git status --short && docker compose --env-file .env -f docker-compose.prod.yml config --quiet"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-069cc54805a1c1d89

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-069cc54805a1c1d89 \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
