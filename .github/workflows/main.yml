name: Deploy PaperGuard

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2 through SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-069cc54805a1c1d89 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "set -e",
              "export HOME=/home/ubuntu",
              "git config --global --add safe.directory /home/ubuntu/devops_vap",
              "cd /home/ubuntu/devops_vap",
              "cp /home/ubuntu/Dockerfile.safe /home/ubuntu/devops_vap/Dockerfile",
              "cp /home/ubuntu/docker-compose.prod.yml.safe /home/ubuntu/devops_vap/docker-compose.prod.yml",
              "git fetch origin main",
              "git checkout -- .github/workflows/main.yml docker-compose.prod.yml",
              "git pull --ff-only origin main",
              "cp /home/ubuntu/Dockerfile.safe /home/ubuntu/devops_vap/Dockerfile",
              "cp /home/ubuntu/docker-compose.prod.yml.safe /home/ubuntu/devops_vap/docker-compose.prod.yml",
              "docker compose --env-file /home/ubuntu/devops_vap/.env -f /home/ubuntu/devops_vap/docker-compose.prod.yml config --quiet",
              "docker compose --env-file /home/ubuntu/devops_vap/.env -f /home/ubuntu/devops_vap/docker-compose.prod.yml up -d --build",
              "curl --fail --silent --show-error http://localhost:8000/",
              "curl --fail --silent --show-error http://localhost:8001/api/health"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command submitted: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-069cc54805a1c1d89 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Deployment command completed."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-069cc54805a1c1d89 \
                  --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-069cc54805a1c1d89 \
                  --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for the SSM command. Check AWS Systems Manager Run Command for details."
          exit 1
